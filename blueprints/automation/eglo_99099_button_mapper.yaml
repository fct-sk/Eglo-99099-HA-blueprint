blueprint:
  name: EGLO 99099 — 3-Group Button Mapper
  description: >-
    Map every supported EGLO 99099 / ERCU_3groups_Zm action to one or more
    Home Assistant actions. The active remote group is taken from
    action_group (1, 2 or 3). The blueprint ignores release messages with
    no action.
  domain: automation
  author: ChatGPT
  homeassistant:
    min_version: 2024.6.0
  source_url: https://github.com/fct-sk/Eglo-99099-HA-blueprint
  input:
    mqtt_topic:
      name: MQTT topic
      description: Complete MQTT topic published by Zigbee2MQTT for the EGLO remote.
      default: zigbee2mqtt1/EgloRemote
      selector:
        text: {}

    group_1:
      name: Group 1
      description: Actions used when the EGLO remote has Group 1 selected.
      icon: mdi:numeric-1-circle
      collapsed: true
